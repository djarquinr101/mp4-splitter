<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast MP4 Splitter (Lossless)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-3xl mx-auto bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
        <h1 class="text-2xl font-bold mb-4 text-emerald-400 text-center">⚡ Instant MP4 Splitter (No Quality Loss)</h1>

        <div id="status" role="status" aria-live="polite" class="text-center p-2 mb-4 bg-amber-500/20 text-amber-300 rounded border border-amber-500/30 text-sm">
            Loading FFmpeg core into your browser...
        </div>

        <div class="mb-6">
            <label for="video-input" class="block text-sm font-semibold mb-2">1. Load your MP4 Video:</label>
            <input type="file" id="video-input" accept="video/mp4" disabled
                   class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-emerald-500 file:text-slate-900 hover:file:bg-emerald-400 cursor-pointer disabled:opacity-50">
            <p id="file-info" class="mt-2 text-xs text-slate-400"></p>
            <div id="detect-settings" class="mt-4 grid grid-cols-2 gap-3 text-xs text-slate-300">
                <label class="flex flex-col gap-1">Silence threshold (dB)
                    <input id="opt-noise" type="number" value="-35" step="1" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm">
                </label>
                <label class="flex flex-col gap-1">Minimum gap (s)
                    <input id="opt-mingap" type="number" value="1" step="0.1" min="0.5" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm">
                </label>
                <label class="flex flex-col gap-1">Minimum segment (s)
                    <input id="opt-minseg" type="number" value="2" step="0.5" min="0.5" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm">
                </label>
                <label class="flex items-center gap-2 self-end pb-1">
                    <input id="opt-black" type="checkbox" checked> Confirm gaps with black frames
                </label>
            </div>
            <progress id="detect-progress" class="w-full mt-3 hidden" max="1" value="0"></progress>
            <p id="detect-note" class="mt-2 text-xs text-amber-300"></p>
        </div>

        <div class="mb-6">
            <span class="block text-sm font-semibold mb-2">2. Define Segments (HH:MM:SS, MM:SS or seconds):</span>
            <div id="segments-container" class="space-y-3"></div>
            <button id="add-segment-btn" type="button" class="mt-3 text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded border border-slate-600 transition-all">
                + Add Another Part
            </button>
            <p class="mt-3 text-xs text-slate-500">
                Lossless cuts can only start on keyframes, so a part may begin slightly before the start time you enter.
            </p>
        </div>

        <button id="process-btn" disabled
                class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold py-3 px-4 rounded-md transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
            Split and Export All Parts
        </button>

        <div id="log-output" class="mt-6 p-4 bg-slate-950 rounded-lg text-xs font-mono max-h-40 overflow-y-auto border border-slate-800 text-slate-400 hidden"></div>
    </div>

    <script src="detect.js"></script>
    <script src="app.js"></script>
</body>
</html>
